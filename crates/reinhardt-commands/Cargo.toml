[package]
name = "reinhardt-commands"
version = "0.4.0-alpha.9"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Django-style management command framework for Reinhardt"

[[bin]]
name = "runserver"
path = "src/bin/runserver.rs"
doc = false
required-features = ["pages"]

[[example]]
name = "page_hot_patch_bench"
path = "examples/page_hot_patch_bench.rs"
required-features = ["pages"]

[dependencies]
crossbeam-channel = "0.5"
reinhardt-apps = { workspace = true }
reinhardt-mail = { workspace = true }
reinhardt-conf = { workspace = true }
reinhardt-dentdelion = { workspace = true, features = ["cli"], optional = true }
reinhardt-urls = { workspace = true, features = ["routers", "database"], optional = true }
reinhardt-db = { workspace = true, features = ["migrations", "backends-settings", "orm", "settings"], optional = true }
reinhardt-test = { workspace = true, optional = true }
reinhardt-di = { workspace = true, optional = true }
reinhardt-core = { workspace = true, optional = true }
reinhardt-http = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
reinhardt-server = { workspace = true, optional = true }
reinhardt-middleware = { workspace = true, optional = true }
reinhardt-auth = { workspace = true, optional = true }
reinhardt-admin = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
reinhardt-pages = { workspace = true, optional = true }
reinhardt-manouche = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true, features = ["signal", "process", "fs"] }
async-trait = { workspace = true }
bollard = "0.20"
futures-util = { workspace = true }
thiserror = { workspace = true }
colored = { workspace = true }
console = "0.16.1"
dialoguer = "0.12.0"
crates_io_api = "0.12.0"
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
tera = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml_edit = "0.25.10"
walkdir = "2.5"
rand = { workspace = true }
regex = { workspace = true }
sha2 = "0.10"
rust-embed = "8.5"
glob = "0.3"
inventory = "0.3"
notify = { version = "8.2.0", optional = true }
rustyline = { version = "17.0.2", optional = true }
evcxr = { version = "0.22.0", optional = true }
dirs = { version = "6.0.0", optional = true }

# AST dependencies for robust code generation
syn = { workspace = true, features = ["full", "parsing", "visit", "visit-mut"] }
quote = { workspace = true }
proc-macro2 = { workspace = true, features = ["span-locations"] }
prettyplease = "0.2"
percent-encoding = "2.3"

# TLS/HTTPS support
rustls = "0.23"
tokio-rustls = "0.26"
hyper-rustls = { version = "0.27", features = ["http1", "http2"] }
rustls-pemfile = "2.0"
rcgen = "0.14.5"
reinhardt-utils = {workspace = true, features = ["utils-core", "staticfiles"]}
reinhardt-rest = {workspace = true, features = ["openapi"], optional = true}
reinhardt-openapi = { workspace = true, optional = true }
reinhardt-grpc = { workspace = true, optional = true }
reinhardt-websockets = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
tungstenite = { workspace = true, optional = true }
cargo_metadata = { workspace = true }
serde_yaml = { workspace = true, optional = true }
url = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
nix = { version = "0.29", features = ["signal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects"] }

[dev-dependencies]
insta = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
regex = { workspace = true }
serial_test = { workspace = true }
rstest = { workspace = true }
proptest = { workspace = true }
trybuild = { workspace = true }
jsonschema = "0.26"

[features]
default = ["server", "autoreload", "pages"]
migrations = ["reinhardt-db"]
routers = ["dep:reinhardt-urls", "dep:reinhardt-http"]
contract = ["migrations", "routers", "dep:reinhardt-core"]
di = ["dep:reinhardt-di"]
openapi = ["dep:reinhardt-rest", "dep:reinhardt-http"]
introspect = ["routers", "dep:serde_yaml"]
openapi-router = ["dep:reinhardt-openapi", "openapi"]
server = ["dep:reinhardt-server", "dep:reinhardt-middleware", "dep:reinhardt-core", "routers", "di", "dep:reinhardt-admin", "dep:reqwest"]
autoreload = ["dep:notify", "server"]
shell = ["dep:evcxr", "dep:rustyline", "dep:dirs", "reinhardt-db", "di"]
reinhardt-db = ["dep:reinhardt-db"]
postgres = ["reinhardt-db?/postgres", "dep:sqlx", "sqlx/postgres"]
sqlite = ["reinhardt-db?/sqlite", "dep:sqlx", "sqlx/sqlite"]
mysql = ["reinhardt-db?/mysql", "dep:sqlx", "sqlx/mysql"]
pgvector = ["reinhardt-db?/pgvector", "reinhardt-admin?/pgvector"]
testcontainers = ["dep:reinhardt-test", "reinhardt-test?/testcontainers"]
plugins = ["dep:reinhardt-dentdelion"]
auth = ["dep:reinhardt-auth", "reinhardt-auth?/database", "reinhardt-db"]
admin = []
pages = ["routers", "reinhardt-urls/client-router", "dep:reinhardt-pages", "reinhardt-pages/hmr"]
grpc = ["server", "dep:tonic", "dep:reinhardt-grpc", "reinhardt-urls/grpc"]
websockets = ["server", "dep:reinhardt-websockets", "dep:tungstenite", "reinhardt-websockets/di"]
full = [
  "migrations",
  "routers",
  "contract",
  "introspect",
  "server",
  "autoreload",
  "shell",
  "reinhardt-db",
  "di",
  "openapi",
  "openapi-router",
  "postgres",
  "sqlite",
  "mysql",
  "testcontainers",
  "plugins",
  "auth",
  "admin",
  "pages",
  "grpc",
  "websockets",
]
