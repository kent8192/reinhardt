[package]
name = "reinhardt-forms"
version = "0.4.0-alpha.9"
description = "Form handling and validation"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Documentation
aquamarine = { workspace = true }

# Internal dependencies
reinhardt-core = { workspace = true, features = ["validators"] }
reinhardt-db = { workspace = true, features = ["orm"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Crypto
subtle = "2"
sha2 = "0.10"

# Regex
regex = "1.10"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { workspace = true }

[features]
full = []

[dev-dependencies]
insta = { workspace = true }
linkme = { workspace = true }
reinhardt-apps = { path = "../reinhardt-apps" }
reinhardt-db = { path = "../reinhardt-db", features = ["associations"] }
tokio-test = "0.4"
rstest = { workspace = true }
proptest = { workspace = true }
tempfile = "3"
# Workaround for KI-2 (rust-lang/cargo#4242, rust-lang/cargo#15151):
# Path-only dev-dep (no version) is stripped from published manifest by cargo,
# avoiding dev-dependency version resolution failure during `cargo publish`.
# When upstream cargo resolves these issues, replace with `workspace = true`.
reinhardt-test = { path = "../reinhardt-test" }
reinhardt-macros = { path = "../reinhardt-core/macros" }
ctor = { workspace = true }
uuid = { workspace = true }
