[package]
name = "reinhardt-storages"
version = "0.4.0-alpha.9"
edition = "2024"
authors = ["Reinhardt Contributors"]
license = "MIT OR Apache-2.0"
description = "Cloud storage backend abstraction for Reinhardt framework"
repository = "https://github.com/kent8192/reinhardt-web"
keywords = ["storage", "s3", "gcs", "azure", "cloud"]
categories = ["web-programming", "filesystem"]

[dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["fs", "rt-multi-thread", "macros"] }
chrono = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
unicode-normalization = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
reinhardt-conf = { workspace = true, features = ["settings"] }
reinhardt-core = { workspace = true, features = ["parsers"] }
reinhardt-providers = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
percent-encoding = { version = "2.3", optional = true }
cap-std = { version = "3.4.5", optional = true }
cap-fs-ext = { version = "3.4.5", optional = true }

# GCS
google-cloud-storage = { version = "1.12.0", optional = true }
google-cloud-auth = { version = "1.10.0", optional = true }

[dev-dependencies]
wiremock = "0.6"
tokio = { workspace = true, features = ["full"] }
tempfile = "3"
rstest = { workspace = true }
uuid = { version = "1", features = ["v4"] }
serial_test = "3"
testcontainers = { workspace = true }
reqwest = { workspace = true }
toml = { workspace = true }

[features]
default = ["s3", "local"]
s3 = ["dep:reinhardt-providers", "reinhardt-providers/aws"]
gcs = [
  "google-cloud-storage",
  "google-cloud-auth",
  "reqwest",
  "bytes",
  "percent-encoding",
]
azure = [
  "reqwest",
  "base64",
  "hmac",
  "sha2",
  "percent-encoding",
]
local = ["tokio/fs", "dep:cap-std", "dep:cap-fs-ext"]
all = ["s3", "gcs", "azure", "local"]
