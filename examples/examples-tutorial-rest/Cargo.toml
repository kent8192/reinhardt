[package]
name = "examples-tutorial-rest"
version = "0.1.0"
edition = "2024"
publish = false
description = "Reinhardt REST tutorial example - Code snippet management API"
default-run = "manage"

# The `manage` binary is auto-discovered from src/bin/manage.rs, matching the
# canonical `cargo run --bin manage -- runserver` form documented in README.

[dependencies]
reinhardt = { workspace = true, features = [
    "minimal",
    "core",
    "conf",
    "database",
    "db-postgres",
    "db-sqlite",
    "commands",
    "di",
    "server",
    "api",  # Includes rest + viewsets
    "client-router",
] }
tokio = { version = "1.48.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
# Participates in the standalone examples resolver constraint from examples/Cargo.toml.
time = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
syntect = "5.2"
ctor = "0.6.1"
inventory = "0.3"

[dev-dependencies]
reinhardt = { workspace = true, features = [
    "test",
    "testcontainers",
] }
rstest = { version = "0.26", default-features = false }
serial_test = "3.2"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tempfile = "3.15"

[build-dependencies]
cfg_aliases = "0.2"

[features]
default = ["with-reinhardt", "client-router"]
# client-router: Enable client-side routing support (required for #[routes] macro with UnifiedRouter)
client-router = []
commands-shell = ["reinhardt/commands-shell"]
with-reinhardt = []

[[test]]
name = "integration"
required-features = ["with-reinhardt"]

[lints]
workspace = true
